<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Printer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Toolbar -->
      <header class="toolbar">
        <div class="toolbar-left">
          <button id="btn-add-images" class="btn btn-primary" aria-label="Add images">
            <!-- label set by JS -->
          </button>
          <input
            id="file-input"
            type="file"
            accept="image/jpeg,image/png,image/gif,image/webp"
            multiple
            hidden
          />
          <span class="columns-control">
            <span id="columns-label" class="columns-label-text"></span>
            <button class="btn btn-col" data-cols="1">1</button>
            <button class="btn btn-col active" data-cols="2">2</button>
            <button class="btn btn-col" data-cols="3">3</button>
          </span>
          <button id="btn-clear-all" class="btn btn-danger" aria-label="Clear all">
            <!-- label set by JS -->
          </button>
        </div>
        <div class="toolbar-right">
          <button id="btn-export-pdf" class="btn btn-export" aria-label="Export PDF">
            <!-- label set by JS -->
          </button>
          <button id="btn-export-jpg" class="btn btn-export" aria-label="Export JPG">
            <!-- label set by JS -->
          </button>
        </div>
      </header>

      <!-- Mobile tab switcher (visible only < 900px) -->
      <div class="tab-switcher" role="tablist">
        <button class="tab-btn active" data-panel="editor" role="tab" aria-selected="true">
          <!-- label set by JS -->
        </button>
        <button class="tab-btn" data-panel="preview" role="tab" aria-selected="false">
          <!-- label set by JS -->
        </button>
      </div>

      <!-- Main panels -->
      <main class="panels">
        <!-- Editor panel -->
        <section id="panel-editor" class="panel panel-editor" aria-label="Editor">
          <!-- Drop zone (shown when no images) -->
          <div id="drop-zone" class="drop-zone" role="button" tabindex="0" aria-label="Drop zone">
            <span id="drop-zone-text"></span>
          </div>
          <!-- Error messages -->
          <div id="error-container" class="error-container" aria-live="polite"></div>
          <!-- Card list -->
          <div id="card-list" class="card-list" aria-label="Image cards"></div>
        </section>

        <!-- Preview panel -->
        <section id="panel-preview" class="panel panel-preview" aria-label="Preview">
          <div id="preview-pages" class="preview-pages"></div>
        </section>
      </main>
    </div>

    <!-- Export overlay -->
    <div id="export-overlay" class="export-overlay hidden" role="status">
      <div class="export-spinner"></div>
      <p id="export-overlay-text"></p>
    </div>

    <!-- CDN libraries (pinned versions) -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

    <!-- App scripts -->
    <script src="i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
